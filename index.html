<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบฝากรูปภาพองค์กร - บริษัท สยาม ฮาร์เวสต์ พรีเมี่ยม จำกัด</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap');

        body {
            font-family: 'Prompt', -apple-system, sans-serif;
            margin: 0; padding: 20px; color: #1C1C1E; -webkit-font-smoothing: antialiased;
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .ocean-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 15% 50%, rgba(255,255,255,0.2), transparent 25%),
                        radial-gradient(circle at 85% 30%, rgba(255,255,255,0.3), transparent 25%);
            z-index: 0; pointer-events: none;
        }

        .upload-container {
            background: rgba(255, 255, 255, 0.75); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 32px; padding: 40px; width: 100%; max-width: 500px;
            box-shadow: 0 20px 50px rgba(0, 89, 130, 0.15); 
            border: 1px solid rgba(255, 255, 255, 0.9);
            text-align: center; z-index: 1; position: relative;
        }

        .header h1 { font-size: 24px; margin: 0 0 5px 0; color: #005f73; font-weight: 600; }
        .header p { margin: 0 0 30px 0; color: #0a9396; font-size: 15px; }

        .drop-zone {
            border: 2px dashed #0a9396; border-radius: 24px; padding: 40px 20px;
            background: rgba(10, 147, 150, 0.05); cursor: pointer; transition: all 0.3s;
            position: relative; overflow: hidden;
        }
        .drop-zone:hover { background: rgba(10, 147, 150, 0.1); transform: scale(1.02); }
        .drop-zone.dragover { background: rgba(10, 147, 150, 0.2); border-color: #005f73; }
        .drop-zone svg { width: 50px; height: 50px; fill: #0a9396; margin-bottom: 10px; }
        .drop-zone span { display: block; color: #005f73; font-weight: 500; font-size: 16px; margin-bottom: 8px; }
        .drop-zone .paste-badge { background: #0a9396; color: white; padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 600; display: inline-block; margin-bottom: 10px; }
        .drop-zone p { color: #6c757d; font-size: 13px; margin-top: 5px; }
        
        #file-input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }

        .result-area { display: none; margin-top: 30px; animation: slideUp 0.4s ease forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .preview-img { width: 100%; max-height: 250px; object-fit: contain; border-radius: 16px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        .url-box {
            display: flex; align-items: center; background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(10, 147, 150, 0.2); border-radius: 16px; padding: 5px; margin-bottom: 15px;
        }
        .url-input {
            flex: 1; border: none; background: transparent; padding: 12px 15px;
            font-family: 'Prompt', sans-serif; font-size: 14px; color: #1C1C1E; outline: none;
        }
        .btn-copy {
            background: #0a9396; color: white; border: none; border-radius: 12px;
            padding: 12px 20px; font-family: 'Prompt'; font-weight: 500; cursor: pointer; transition: 0.2s;
        }
        .btn-copy:hover { background: #005f73; }

        .btn-reset {
            background: transparent; color: #e63946; border: 1px solid rgba(230, 57, 70, 0.4);
            border-radius: 99px; padding: 10px 24px; font-family: 'Prompt'; font-weight: 500; cursor: pointer; transition: 0.2s;
            width: 100%; font-size: 16px;
        }
        .btn-reset:hover { background: #e63946; color: white; }

        .loader-container { display: none; margin-top: 20px; }
        .spinner {
            width: 40px; height: 40px; border: 4px solid rgba(10, 147, 150, 0.2);
            border-top: 4px solid #0a9396; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-text { color: #0a9396; font-weight: 500; margin-top: 10px; font-size: 15px; }

        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 12px; }
        .toast {
            min-width: 250px; padding: 16px 20px; border-radius: 20px; color: #1C1C1E; font-size: 14px;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.6);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); animation: slideDown 0.4s forwards; border-left: 5px solid #0a9396;
        }
        @keyframes slideDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    </style>
</head>
<body>
    <div class="ocean-bg"></div>
    <div id="toast-container"></div>

    <div class="upload-container">
        <div class="header">
            <h1>ระบบฝากรูปภาพส่วนกลาง</h1>
            <p>บริษัท สยาม ฮาร์เวสต์ พรีเมี่ยม จำกัด</p>
        </div>

        <div class="drop-zone" id="drop-zone">
            <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
            <span>แตะเพื่อเลือกรูปภาพ หรือ ลากไฟล์มาวางที่นี่</span>
            <div class="paste-badge">✨ รองรับการกดยืนยัน (Ctrl+V / Cmd+V)</div>
            <p>รองรับไฟล์ JPG, PNG, WEBP (บีบอัดอัตโนมัติ)</p>
            <input type="file" id="file-input" accept="image/*">
        </div>

        <div class="loader-container" id="loader">
            <div class="spinner"></div>
            <div class="loading-text" id="loading-text">กำลังประมวลผล...</div>
        </div>

        <div class="result-area" id="result-area">
            <img src="" alt="ภาพตัวอย่าง" class="preview-img" id="preview-img">
            <p style="text-align: left; margin: 0 0 5px 5px; font-weight: 500; font-size: 14px; color: #005f73;">Direct Link (นำไปใช้วางในระบบได้ทันที):</p>
            <div class="url-box">
                <input type="text" id="url-output" class="url-input" readonly>
                <button class="btn-copy" onclick="copyUrl()">คัดลอกลิงก์</button>
            </div>
            <button class="btn-reset" onclick="resetForm()">อัปโหลดไฟล์ใหม่</button>
        </div>
    </div>

    <script>
        // [!] เอา URL ของ Apps Script ล่าสุดของมึงมาวางตรงนี้นะ
        const UPLOAD_API_URL = 'https://script.google.com/macros/s/AKfycbwBh1vO8rLJbsLAREreYrn3VFrYIQ7cMJ8_DMLjdLLjnQhgD_-lGUEBQjcdwtTVnS5Q/exec';

        const fileInput = document.getElementById('file-input');
        const dropZone = document.getElementById('drop-zone');

        function showToast(title, message) {
            const toast = document.createElement('div');
            toast.className = `toast`;
            toast.innerHTML = `<strong style="color:#005f73; font-size: 15px;">${title}</strong><br><span style="color:#0a9396; font-size: 14px;">${message}</span>`;
            document.getElementById('toast-container').appendChild(toast);
            setTimeout(() => { toast.remove(); }, 4000);
        }

        // ระบบดักจับวางรูป (Ctrl+V / Cmd+V)
        document.addEventListener('paste', (e) => {
            if(document.getElementById('loader').style.display === 'block') return;
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let index in items) {
                const item = items[index];
                if (item.kind === 'file' && item.type.startsWith('image/')) {
                    const file = item.getAsFile();
                    showToast('วางรูปภาพสำเร็จ', 'กำลังประมวลผลรูปภาพที่ก๊อปปี้มา...');
                    handleUpload(file);
                    break;
                }
            }
        });

        // ระบบลากไฟล์มาวาง
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('dragover'); });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault(); dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) handleUpload(e.dataTransfer.files[0]);
        });
        
        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) handleUpload(fileInput.files[0]);
        });

        // ฟังก์ชันบีบอัดรูป
        function compressImage(file, maxWidth = 1024, maxHeight = 1024, quality = 0.8) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        let width = img.width, height = img.height;
                        if (width > height) {
                            if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
                        } else {
                            if (height > maxHeight) { width = Math.round((width * maxHeight) / height); height = maxHeight; }
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        const dataUrl = canvas.toDataURL('image/webp', quality);
                        const splitData = dataUrl.split(',');
                        resolve({ base64Data: splitData[1], mimeType: splitData[0].match(/:(.*?);/)[1] });
                    };
                    img.onerror = reject;
                };
                reader.onerror = reject;
            });
        }

        // อัปโหลดขึ้น Drive
        async function handleUpload(pastedFile = null) {
            const file = pastedFile;
            if (!file) return;
            
            dropZone.style.display = 'none';
            document.getElementById('loader').style.display = 'block';
            document.getElementById('loading-text').innerText = "กำลังประมวลผลและบีบอัดรูปภาพ...";

            try {
                const previewUrl = URL.createObjectURL(file);
                document.getElementById('preview-img').src = previewUrl;

                const compressed = await compressImage(file);
                const payload = {
                    fileName: "SIAM_HARVEST_IMG_" + new Date().getTime() + ".webp",
                    mimeType: compressed.mimeType,
                    base64Data: compressed.base64Data
                };

                document.getElementById('loading-text').innerText = "กำลังส่งข้อมูลไปยัง Google Drive...";

                const response = await fetch(UPLOAD_API_URL, {
                    method: 'POST',
                    redirect: 'follow',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();

                if (result.status === 'success') {
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('result-area').style.display = 'block';
                    document.getElementById('url-output').value = result.url;
                    showToast('อัปโหลดเสร็จสิ้น', 'ระบบบันทึกรูปลง Drive สำเร็จแล้ว');
                } else {
                    throw new Error(result.message);
                }

            } catch (error) {
                alert('เกิดข้อผิดพลาดในการดำเนินการ: ' + error.message);
                resetForm();
            }
        }

        function copyUrl() {
            const copyText = document.getElementById("url-output");
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(copyText.value);
            showToast('คัดลอกสำเร็จ', 'นำลิงก์ไปวางในระบบได้เลย');
        }

        function resetForm() {
            fileInput.value = '';
            document.getElementById('result-area').style.display = 'none';
            document.getElementById('loader').style.display = 'none';
            dropZone.style.display = 'block';
        }
    </script>
</body>
</html>
